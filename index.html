<body>


<!-- =========================
     Header
========================= -->

<header class="header">

    <div class="container header-content">


        <!-- Logo -->

        <div class="logo">

            <span>💜</span>

            <div>

                <h1>
                    نیکی فمیلی
                </h1>

                <small>
                    انجمن دوستان نیکی سمیعی
                </small>

            </div>

        </div>


        <!-- Header buttons -->

        <div class="header-buttons">

            <button
                class="new-topic-btn"
                onclick="openTopicForm()">

                + ساخت تاپیک

            </button>

        </div>


    </div>

</header>



<!-- =========================
     Main
========================= -->

<main class="container">


    <!-- Hero -->

    <section class="hero">

        <h2>
            نیکی فمیلی 💜
        </h2>

        <p>

            به انجمن نیکی فمیلی خوش آمدید.

            اینجا می‌توانید با دوستان و طرفداران
            <strong>نیکی سمیعی</strong>
            گفتگو کنید، تاپیک بسازید و به تاپیک‌های دیگران پاسخ دهید.

        </p>

    </section>



    <!-- Search -->

    <section class="search-box">

        <label for="searchInput">

            جستجو در نیکی فمیلی

        </label>

        <input
            type="search"
            id="searchInput"
            placeholder="مثلاً نیکی سمیعی..."
            oninput="searchTopics()">

    </section>



    <!-- Forum -->

    <section class="forum">


        <div class="section-title">

            <h2>

                آخرین تاپیک‌های نیکی فمیلی

            </h2>


            <span id="topicCount">

                0 تاپیک

            </span>

        </div>


        <div id="topics"></div>


    </section>


</main>



<!-- =========================
     ساخت تاپیک
========================= -->

<div id="topicModal"
     class="modal">


    <div class="modal-box">


        <button
            class="close"
            onclick="closeTopicForm()">

            ×

        </button>


        <h2>

            ساخت تاپیک در نیکی فمیلی

        </h2>


        <input
            id="username"
            type="text"
            placeholder="نام شما">


        <input
            id="topicTitle"
            type="text"
            placeholder="عنوان تاپیک">


        <textarea
            id="topicText"
            placeholder="موضوع خود را بنویسید..."></textarea>


        <button
            class="submit-btn"
            onclick="createTopic()">

            ایجاد تاپیک

        </button>


    </div>

</div>



<!-- =========================
     مشاهده تاپیک
========================= -->

<div id="topicView"
     class="modal">


    <div class="modal-box topic-page">


        <button
            class="close"
            onclick="closeTopic()">

            ×

        </button>


        <div id="topicContent"></div>


        <hr>


        <h3>

            پاسخ به تاپیک

        </h3>


        <input
            id="replyName"
            type="text"
            placeholder="نام شما">


        <textarea
            id="replyText"
            placeholder="پاسخ خود را بنویسید..."></textarea>


        <button
            class="submit-btn"
            onclick="addReply()">

            ارسال پاسخ

        </button>


    </div>

</div>



<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

========================= -->
